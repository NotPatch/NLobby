# NLobby Velocity Queue Configuration
# Requires: LimboAPI Velocity plugin (https://github.com/Elytrium/LimboAPI/)

queue:
  enabled: true

  # Limbo sunucu adı (virtual server - LimboAPI tarafından otomatik oluşturulur)
  # Oyuncular queue sırasında bu sanal sunucuda beklenir
  queue-server: "nlobby-limbo"

  # Queue kontrol edilecek sunucu adları
  # Boş liste = tüm sunuculara giriş queue kontrol edilir
  # Örnek: ["survival", "skywars"] - sadece bu sunuculara giriş queue kontrol edilir
  target-servers: []

  # Aynı anda hedef sunucu(lara) geçebilecek maksimum oyuncu
  max-slots: 5

  # Her tick'te sıradan hedef sunucuya geçirilecek oyuncu sayısı
  slots-per-tick: 2

  # Tick aralığı (saniye)
  tick-interval: 5
