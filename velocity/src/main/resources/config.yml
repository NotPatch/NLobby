# NLobby Velocity Queue Configuration
queue:
  enabled: true

  # Queue kontrol edilecek sunucu adları
  # Boş liste = tüm sunuculara giris queue kontrol edilir
  # Örnek: ["survival", "skywars"] - sadece bu sunuculara giriş queue kontrol edilir
  target-servers: []

  # Aynı anda hedef sunucu(lara) geçebilecek maksimum oyuncu
  max-slots: 5

  # Her tick'te sıradan hedef sunucuya geçirilecek oyuncu sayısı
  slots-per-tick: 2

  # Tick aralığı (saniye)
  tick-interval: 5

  # Queue sırası listesinde kalma süresi (dakika)
  # Bu süre içinde bağlanmazsa sıradan çıkar ve birbirinden sırada bekleyeni geçer
  allowed-ttl-minutes: 10

# LIMBO SERVER SETUP SEÇENEKLERI:
#
# Seçenek 1: LimboAPI kullanmak (Önerilen)
#   - Velocity plugin olarak LimboAPI yükle
#   - LimboAPI otomatik "nlobby-limbo" adında virtual server oluşturacak
#
# Seçenek 2: Manuel Paper server
#   - Boş bir Paper server aç ("nlobby-limbo" ya da "limbo" adında)
#   - Velocity config'de bağla
#   - Oyuncular bu sunucuda bekleyecek
#
# Plugin gelecek order: Velocity → nlobby-velocity → (LimboAPI) → Paper servers
