# NLobby Velocity Queue Configuration
queue:
  enabled: true
  # Queue kontrol edilecek sunucu adları (boş = tüm sunucular kontrol edilir)
  # Örnek: ["survival", "skywars"] - sadece bu sunuculara giriş queue kontrol edilir
  target-servers: []

  # Oyuncular queue sırasında bekleme sunucusu (örn: "queue-lobby", "lobby")
  queue-server: "lobby"

  # Aynı anda hedef sunucu(lara) geçebilecek maksimum oyuncu
  max-slots: 5

  # Her tick'te sıradan hedef sunucuya geçirilecek oyuncu sayısı
  slots-per-tick: 2

  # Tick aralığı (saniye)
  tick-interval: 5

  # Queue sırası listesinde kalma süresi (dakika) - bu süre içinde bağlanmazsa sıradan çıkar
  allowed-ttl-minutes: 10
